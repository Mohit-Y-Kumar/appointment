apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: docnest-letsencrypt-prod
spec:
  acme:
    email: ops@docnest.example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: docnest-letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
